              - generic [ref=f29e84]:
                - generic [ref=f29e85]:
                  - paragraph [ref=f29e86]: 请介绍一下你熟悉的Java集合框架，HashMap的底层实现原理是什么？
                  - generic [ref=f29e87]: 技术基础
                - generic [ref=f29e88]:
                  - paragraph [ref=f29e89]: 参考答题思路
                  - paragraph [ref=f29e90]: 结合简历中的Java技能，回答时应涵盖List、Set、Map的核心类。重点阐述HashMap在JDK 1.8中的实现：数组+链表+红黑树结构，当链表长度大于8且数组长度大于64时转化为红黑树，并说明哈希冲突的解决方式以及扩容机制。
