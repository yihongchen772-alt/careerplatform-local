                  - paragraph [ref=f29e100]: 由于简历没有具体项目支撑，可以从通用的MySQL原理出发回答。列举常见的索引失效情况，如：联合索引不满足最左匹配原则、在索引列上进行函数或计算、使用like查询且通配符在最左边、隐式类型转换等。
