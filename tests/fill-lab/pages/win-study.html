<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>北森 zhiye 式与智联、B 站：学习形式、具体学制、受教育类型、是否全日制</title><style>body{font:14px sans-serif;max-width:860px;margin:20px auto}.form-item{margin:8px 0}</style></head><body>
<!-- Fictional, after zhiye (申能), 智联校园 and B 站 forms seen in 网申样本. -->
<h3>个人信息</h3>
<div class=form-item><label for=mode>学习形式</label><select id=mode><option value=''>请选择</option><option>全日制</option><option>非全日制</option></select></div>
<h3>教育经历</h3>
<div class=form-item><label for=z-deg>学历</label><select id=z-deg><option value=''>请选择</option><option>本科</option><option>硕士研究生</option><option>博士研究生</option></select></div>
<div class=form-item><label for=z-school>学校名称</label><input id=z-school></div>
<div class=form-item><label for=z-years>具体学制</label><select id=z-years><option value=''>请选择</option><option>1年</option><option>2年</option><option>3年</option><option>4年</option><option>5年</option></select></div>
<div class=form-item><label for=z-mode>学习形式</label><select id=z-mode><option value=''>请选择</option><option>全日制</option><option>非全日制</option></select></div>
<div class=form-item><label for=z-edu-type>受教育类型</label><select id=z-edu-type><option value=''>请选择您的所受教育类型</option><option>统招全日制</option><option>非统招</option><option>自考</option></select></div>
<div class=form-item><label for=z-full>是否全日制</label><select id=z-full><option value=''>请选择</option><option>是</option><option>否</option></select></div>
</body></html>
