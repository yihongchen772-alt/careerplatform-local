<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>飞书招聘新版表单（ud-formily，智元机器人式）</title>
<style>body{font:14px sans-serif;max-width:820px;margin:20px auto}.ud-formily-item{margin:10px 0}.ud-formily-item-label{color:#444;font-size:12px}.sel{border:1px solid #ccc;padding:6px;cursor:pointer;min-width:200px}.ud__select__dropdown{border:1px solid #aaa;width:200px}.ud__select__dropdown-hidden{display:none}.ud__select__list__item{padding:4px;cursor:pointer}</style></head>
<body>
<!-- Structure of agirobot.jobs.feishu.cn (网申样本, 2026-10-22): labels sit in .ud-formily-item-label beside a control nested 5-9 wrappers deep;
     selects are .ud__select__selector with a readonly combobox input and a hidden .ud__select__dropdown of .ud__select__list__item (no role=option). -->
<form class="ud-formily-layout">
<div class="applyFormModuleWrapper"><div class="applyFormModuleWrapper-left"><div class="applyFormModuleWrapper-title"><p>基本信息</p></div></div>
<div class="applyFormModuleWrapper-right"><div class="register-form-group-wrapper">
  <div data-form-field-id="name" data-form-field-i18n-name="姓名" class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>姓名</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="ud__input"><label class="ud__input-input-wrap"><div class="ud__input-input__placeholder__wrapper"><input id="name" class="ud__native-input" data-form-field-i18n-name="姓名"></div></label></div></div></div></div></div>
  <div data-form-field-id="email" class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>邮箱</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="ud__input"><label class="ud__input-input-wrap"><div class="ud__input-input__placeholder__wrapper"><input id="email" class="ud__native-input"></div></label></div></div></div></div></div>
  <div data-form-field-id="age" class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>年龄</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="ud__input-number"><div class="ud__input-number__input-wrap"><input id="age" class="ud__native-input" role="spinbutton"></div></div></div></div></div></div>
  <div data-form-field-id="gender" class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>性别</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div><div class="ud__select__selector sel" id="gender-sel"><div class="ud__select__selector__content"><div class="ud__select__selector__selectItem"></div><div class="ud__select__selector__search"><input class="ud__select__selector__search__input ud__native-input" role="combobox" autocomplete="off" type="search" readonly></div></div></div></div></div></div></div></div>
</div></div></div>
<div class="applyFormModuleWrapper"><div class="applyFormModuleWrapper-left"><div class="applyFormModuleWrapper-title"><p>教育经历</p></div></div>
<div class="applyFormModuleWrapper-right"><div class="ud-formily-item"><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="apply-form-array-card"><div class="apply-form-array-card-content"><div class="register-form-group-wrapper">
  <div class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>学校名称</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="ud__input"><label class="ud__input-input-wrap"><div><input id="school" class="ud__native-input"></div></label></div></div></div></div></div>
  <div class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>专业</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="ud__input"><label class="ud__input-input-wrap"><div><input id="major" class="ud__native-input"></div></label></div></div></div></div></div>
  <div class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>起止时间</label><span>*</span></span></div></div><div class="ud-formily-item-label-desc">无准确的毕业时间可填写预计毕业时间</div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div class="throne-biz-date-range-picker-wrapper"><div class="throne-biz-date-range-picker-input"><div class="ud__input"><label class="ud__input-input-wrap"><div><input id="start" class="ud__native-input"></div></label></div></div><div class="throne-biz-date-range-picker-rangeInput-seperator"><div class="throne-biz-date-range-picker-seperator"></div></div><div class="throne-biz-date-range-picker-input"><div class="ud__input"><label class="ud__input-input-wrap"><div><input id="end" class="ud__native-input"></div></label></div></div></div></div></div></div></div>
  <div class="ud-formily-item"><div class="ud-formily-item-label"><div class="ud-formily-item-label-content"><span><label>学历</label><span>*</span></span></div></div><div class="ud-formily-item-control"><div class="ud-formily-item-control-content"><div class="ud-formily-item-control-content-component"><div><div class="ud__select__selector sel" id="degree-sel"><div class="ud__select__selector__content"><div class="ud__select__selector__selectItem"></div><div class="ud__select__selector__search"><input class="ud__select__selector__search__input ud__native-input" role="combobox" autocomplete="off" type="search" readonly></div></div></div></div></div></div></div></div>
</div></div></div></div></div></div></div></div>
</form>
<div id="portal"></div>
<script>
// One shared dropdown, like the real page's body-level portal: hidden until a selector is clicked.
const lists = { "gender-sel": ["男", "女", "保密"], "degree-sel": ["本科", "硕士", "博士"] };
const dd = document.createElement("div"); dd.className = "ud__select__dropdown ud__select__dropdown-hidden";
document.getElementById("portal").appendChild(dd);
let current = null;
document.querySelectorAll(".ud__select__selector").forEach((sel) => sel.addEventListener("click", () => {
  current = sel; dd.className = "ud__select__dropdown";
  dd.innerHTML = lists[sel.id].map((t) => `<div class="ud__select__list__item"><div class="ud__select__list__item__content"><span><span>${t}</span></span></div></div>`).join("");
}));
dd.addEventListener("click", (e) => { const item = e.target.closest(".ud__select__list__item"); if (!item || !current) return; current.querySelector(".ud__select__selector__selectItem").textContent = item.textContent.trim(); dd.className = "ud__select__dropdown ud__select__dropdown-hidden"; });
</script>
</body></html>
