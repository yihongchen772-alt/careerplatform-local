<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>某集团校招 · 网申（语言成绩、学生干部、英文国家/城市）</title>
<style>body{font:14px sans-serif;max-width:760px;margin:20px auto}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>span{width:200px}.block{border:1px dashed #ccc;padding:6px 10px;margin:8px 0}</style></head>
<body>
<!-- Labels from boxes typed by hand on 海尔、腾讯 and Microsoft before v1.22. -->
<h3>基本信息</h3>
<div class="row"><span>姓名</span><input id="b1"></div>
<div class="row"><span>IELTS</span><input id="b2"></div>
<div class="row"><span>托福成绩</span><input id="b3"></div>
<div class="row"><span>Country/region of residence</span><select id="b4"><option value="">Select</option><option>China</option><option>Singapore</option><option>United States</option></select></div>
<div class="row"><span>City, state, or country/region</span><input id="b5"></div>
<h3>语言能力</h3>
<div class="block">
  <div class="row"><span>语种</span><select id="l1"><option value="">请选择</option><option>英语</option><option>日语</option></select></div>
  <div class="row"><span>考试类型</span><select id="l2"><option value="">请选择</option><option>大学英语四级</option><option>大学英语六级</option><option>雅思</option><option>托福</option></select></div>
  <div class="row"><span>分数</span><input id="l3"></div>
  <div class="row"><span>考试时间</span><input id="l4" placeholder="2023-06"></div>
</div>
<div class="block">
  <div class="row"><span>语种</span><select id="l5"><option value="">请选择</option><option>英语</option><option>日语</option></select></div>
  <div class="row"><span>考试类型</span><select id="l6"><option value="">请选择</option><option>大学英语四级</option><option>大学英语六级</option><option>雅思</option><option>托福</option></select></div>
  <div class="row"><span>分数</span><input id="l7"></div>
  <div class="row"><span>考试时间</span><input id="l8" placeholder="2023-06"></div>
</div>
<h3>学生干部</h3>
<div class="row"><span>* 是否担任学生干部</span><label><input type="radio" name="cadre" id="c1y" value="是">是</label><label><input type="radio" name="cadre" id="c1n" value="否">否</label></div>
<div class="row"><span>* 干部名称</span><input id="c2"></div>
<div class="row"><span>* 干部层级</span><select id="c3"><option value="">请选择</option><option>校级</option><option>院级</option><option>班级</option></select></div>
</body></html>
