<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>某集团校招 · 网申（校园经历、学生干部、排名、调剂）</title>
<style>body{font:14px sans-serif;max-width:720px;margin:20px auto}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row span{width:120px}</style></head>
<body>
<!-- Field names taken from real portals (歌尔 hotjob、中国移动、51job), each caption a bare span beside its box. -->
<h3>基本信息</h3>
<div class="row"><span>姓名</span><input id="b1"></div>
<div class="row"><span>是否学生干部*</span><label><input type="radio" name="cadre" id="b2y">是</label><label><input type="radio" name="cadre" id="b2n">否</label></div>
<div class="row"><span>学习成绩排名*</span><input id="b3"></div>
<div class="row"><span>是否接受岗位调剂*</span><select id="b4"><option value="">请选择</option><option>是</option><option>否</option></select></div>
<div class="row"><span>研究方向</span><input id="b5"></div>
<div class="row"><span>主修课程*</span><textarea id="b6"></textarea></div>
<h3>教育经历</h3>
<div class="row"><span>学校名称</span><input id="e1"></div>
<div class="row"><span>院系</span><input id="e2"></div>
<div class="row"><span>专业</span><input id="e3"></div>
<h3>项目经历</h3>
<div class="row"><span>项目名称</span><input id="p1"></div>
<div class="row"><span>项目职务</span><input id="p2"></div>
<h3>校园经历</h3>
<div class="row"><span>组织团体名称</span><input id="c1"></div>
<div class="row"><span>担任职务</span><input id="c2"></div>
<div class="row"><span>干部级别</span><select id="c3"><option value="">请选择</option><option>校级</option><option>院级</option><option>班级</option></select></div>
<div class="row"><span>开始时间</span><input id="c4" type="month"></div>
<div class="row"><span>结束时间</span><input id="c5" type="month"></div>
<div class="row"><span>学生干部描述*</span><textarea id="c6"></textarea></div>
</body></html>
