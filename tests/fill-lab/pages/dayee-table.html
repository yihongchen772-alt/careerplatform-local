<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>某银行总行 2026 校园招聘 · 简历填写</title>
<style>body{font:12px "宋体",SimSun,sans-serif;background:#fff}table{border-collapse:collapse;width:860px;margin:10px auto}td{border:1px solid #c9d7e6;padding:5px}td.lbl{background:#eef4fb;text-align:right;width:120px}.title{background:#3b6fb6;color:#fff;font-weight:bold;padding:6px}</style>
</head>
<body>
<form name="resumeForm">
<table>
  <tr><td colspan="4" class="title">个人基本信息</td></tr>
  <tr>
    <td class="lbl"><font color="red">*</font>姓　　名：</td><td><input type="text" name="xm" size="20"></td>
    <td class="lbl">姓名拼音：</td><td><input type="text" name="xmpy" size="20"></td>
  </tr>
  <tr>
    <td class="lbl"><font color="red">*</font>性　　别：</td>
    <td><input type="radio" name="xb" value="1">男&nbsp;&nbsp;<input type="radio" name="xb" value="2">女</td>
    <td class="lbl"><font color="red">*</font>出生年月：</td>
    <td>
      <select name="csn"><option value="">请选择</option><option>1999</option><option>2000</option><option>2001</option><option>2002</option><option>2003</option></select>年
      <select name="csy"><option value="">请选择</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>月
    </td>
  </tr>
  <tr>
    <td class="lbl"><font color="red">*</font>证件号码：</td><td><input type="text" name="zjhm" size="24"></td>
    <td class="lbl"><font color="red">*</font>民　　族：</td>
    <td><select name="mz"><option value="00">--请选择--</option><option value="01">汉族</option><option value="02">蒙古族</option><option value="03">回族</option></select></td>
  </tr>
  <tr>
    <td class="lbl"><font color="red">*</font>移动电话：</td><td><input type="text" name="sj" size="20" maxlength="11"></td>
    <td class="lbl"><font color="red">*</font>电子邮件：</td><td><input type="text" name="yx" size="28"></td>
  </tr>
  <tr>
    <td class="lbl">固定电话：</td><td><input type="text" name="gddh" size="20"></td>
    <td class="lbl"><font color="red">*</font>政治面貌：</td>
    <td><select name="zzmm"><option value="">请选择</option><option value="1">中共党员</option><option value="2">中共预备党员</option><option value="3">共青团员</option><option value="4">群众</option></select></td>
  </tr>
  <tr>
    <td class="lbl">家庭住址：</td><td colspan="3"><input type="text" name="jtzz" size="60"></td>
  </tr>
  <tr>
    <td class="lbl">邮政编码：</td><td><input type="text" name="yzbm" size="10"></td>
    <td class="lbl"><font color="red">*</font>生源地：</td><td><input type="text" name="syd" size="20"></td>
  </tr>
  <tr><td colspan="4" class="title">最高学历教育情况</td></tr>
  <tr>
    <td class="lbl"><font color="red">*</font>毕业院校：</td><td><input type="text" name="byyx" size="28"></td>
    <td class="lbl"><font color="red">*</font>所学专业：</td><td><input type="text" name="sxzy" size="24"></td>
  </tr>
  <tr>
    <td class="lbl"><font color="red">*</font>学　　历：</td>
    <td><select name="xl"><option value="">请选择</option><option value="21">大学本科</option><option value="31">硕士研究生</option><option value="41">博士研究生</option></select></td>
    <td class="lbl"><font color="red">*</font>毕业时间：</td><td><input type="text" name="bysj" size="12"> <span style="color:#999">格式：2026-07-01</span></td>
  </tr>
  <tr>
    <td class="lbl"><font color="red">*</font>外语水平：</td>
    <td><select name="wy"><option value="">请选择</option><option>未通过</option><option>大学英语四级</option><option>大学英语六级</option><option>专业英语八级</option></select></td>
    <td class="lbl">外语成绩：</td><td><input type="text" name="wycj" size="8"></td>
  </tr>
  <tr><td colspan="4" class="title">紧急联系人</td></tr>
  <tr>
    <td class="lbl">联系人姓名：</td><td><input type="text" name="lxrxm" size="20"></td>
    <td class="lbl">联系人电话：</td><td><input type="text" name="lxrdh" size="20"></td>
  </tr>
  <tr><td colspan="4" class="title">个人及家庭信息</td></tr>
  <tr>
    <td class="lbl">现居城市：</td><td><input type="text" name="xjcs" size="20"></td>
    <td class="lbl">父母姓名：</td><td><input type="text" name="fmxm" size="20"></td>
  </tr>
  <tr><td colspan="4" class="title">自我评价</td></tr>
  <tr><td class="lbl">自我评价：</td><td colspan="3"><textarea name="zwpj" rows="5" cols="80"></textarea></td></tr>
</table>
</form>
</body>
</html>
