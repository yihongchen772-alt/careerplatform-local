<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>京东 / 美团式网申（奖学金、评优表彰、校园经历名称、考试分数、项目链接）</title>
<style>body{font:14px sans-serif;max-width:860px;margin:20px auto}.item{display:flex;gap:8px;align-items:center;margin:8px 0}.item>label{width:120px;text-align:right;color:#666;font-size:12px}.block{border-bottom:1px solid #eee;padding:8px 0}</style></head>
<body>
<!-- Label shapes hand-typed on campus.jd.com and zhaopin.meituan.com on 2026-10-22 (网申样本 auto-*). -->
<div class="item"><label for="s1">考试分数*</label><input id="s1" placeholder="请输入"></div>
<div class="item"><label for="s2">语言考试成绩:</label><textarea id="s2" placeholder="请填写语言考试成绩"></textarea></div>
<h3>奖学金</h3>
<div class="block"><div class="item"><label for="a1">*奖学金名称:</label><input id="a1" placeholder="请输入"></div></div>
<h3>评优表彰</h3>
<div class="block"><div class="item"><label for="a2">*评优表彰名称:</label><input id="a2" placeholder="请输入"></div></div>
<h3>校园经历</h3>
<div class="block">
  <div class="item"><label for="c1">校园经历名称*</label><input id="c1" placeholder="请输入校园经历名称"></div>
  <div class="item"><label for="c2">角色</label><input id="c2" placeholder="请输入"></div>
  <div class="item"><label for="c3">校园经历描述</label><textarea id="c3" placeholder="请输入校园经历描述"></textarea></div>
</div>
<h3>项目经历</h3>
<div class="block">
  <div class="item"><label for="p1">项目名称</label><input id="p1" placeholder="请输入项目名称"></div>
  <div class="item"><label for="p2">项目链接</label><input id="p2" placeholder="请输入项目链接"></div>
</div>
<div class="block">
  <div class="item"><label for="p3">项目名称</label><input id="p3" placeholder="请输入项目名称"></div>
  <div class="item"><label for="p4">项目链接</label><input id="p4" placeholder="请输入项目链接"></div>
</div>
</body></html>
