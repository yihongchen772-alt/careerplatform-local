<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>应聘登记表</title>
<link rel="stylesheet" href="/vendor/element-plus.css">
<style>body{margin:0;padding:16px 24px;font-family:-apple-system,"PingFang SC",sans-serif}.part-title{font-size:15px;font-weight:600;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid #eee}.sub-title{color:#666;margin:6px 0}</style>
</head>
<body>
<div id="app">
  <el-form label-position="top" :model="f">
    <div class="part-title">个人信息</div>
    <el-row :gutter="16">
      <el-col :span="8"><el-form-item label="姓名" required><el-input v-model="f.name" placeholder="请输入"></el-input></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="手机号码" required><el-input v-model="f.phone" placeholder="请输入"></el-input></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="电子邮箱" required><el-input v-model="f.email" placeholder="请输入"></el-input></el-form-item></el-col>
    </el-row>
    <el-row :gutter="16">
      <el-col :span="8"><el-form-item label="性别" required><el-radio-group v-model="f.gender"><el-radio value="1">男</el-radio><el-radio value="2">女</el-radio></el-radio-group></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="出生年月"><el-date-picker v-model="f.birth" type="month" placeholder="选择月" value-format="YYYY-MM" :editable="false"></el-date-picker></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="民族"><el-select v-model="f.nation" filterable placeholder="请选择"><el-option v-for="n in nations" :key="n" :label="n" :value="n"></el-option></el-select></el-form-item></el-col>
    </el-row>
    <el-row :gutter="16">
      <el-col :span="8"><el-form-item label="政治面貌"><el-select v-model="f.politics" placeholder="请选择"><el-option v-for="n in ['中共党员','中共预备党员','共青团员','群众']" :key="n" :label="n" :value="n"></el-option></el-select></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="籍贯"><el-cascader v-model="f.hometown" :options="regions" placeholder="请选择"></el-cascader></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="身份证号"><el-input v-model="f.idno" placeholder="请输入"></el-input></el-form-item></el-col>
    </el-row>

    <div class="part-title">教育背景</div>
    <div v-for="(e, i) in f.edu" :key="i">
      <div class="sub-title">{{ i === 0 ? '第一段教育经历' : '第二段教育经历' }}</div>
      <el-row :gutter="16">
        <el-col :span="8"><el-form-item label="学校名称"><el-input v-model="e.school"></el-input></el-form-item></el-col>
        <el-col :span="8"><el-form-item label="学历"><el-select v-model="e.degree" placeholder="请选择"><el-option v-for="d in ['大专','本科','硕士','博士']" :key="d" :label="d" :value="d"></el-option></el-select></el-form-item></el-col>
        <el-col :span="8"><el-form-item label="专业"><el-input v-model="e.major"></el-input></el-form-item></el-col>
      </el-row>
      <el-row :gutter="16">
        <el-col :span="8"><el-form-item label="入学时间"><el-date-picker v-model="e.start" type="month" placeholder="选择月" value-format="YYYY-MM"></el-date-picker></el-form-item></el-col>
        <el-col :span="8"><el-form-item label="毕业时间"><el-date-picker v-model="e.end" type="month" placeholder="选择月" value-format="YYYY-MM"></el-date-picker></el-form-item></el-col>
        <el-col :span="8"><el-form-item label="GPA"><el-input v-model="e.gpa"></el-input></el-form-item></el-col>
      </el-row>
    </div>

    <div class="part-title">家庭成员</div>
    <el-row :gutter="16">
      <el-col :span="6"><el-form-item label="姓名"><el-input v-model="f.fam.name"></el-input></el-form-item></el-col>
      <el-col :span="6"><el-form-item label="关系"><el-select v-model="f.fam.rel" placeholder="请选择"><el-option v-for="d in ['父亲','母亲','配偶','其他']" :key="d" :label="d" :value="d"></el-option></el-select></el-form-item></el-col>
      <el-col :span="6"><el-form-item label="工作单位"><el-input v-model="f.fam.org"></el-input></el-form-item></el-col>
      <el-col :span="6"><el-form-item label="联系电话"><el-input v-model="f.fam.phone"></el-input></el-form-item></el-col>
    </el-row>

    <div class="part-title">紧急联系人</div>
    <el-row :gutter="16">
      <el-col :span="8"><el-form-item label="紧急联系人姓名"><el-input v-model="f.emer.name"></el-input></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="紧急联系人电话"><el-input v-model="f.emer.phone"></el-input></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="与本人关系"><el-input v-model="f.emer.rel"></el-input></el-form-item></el-col>
    </el-row>

    <div class="part-title">其他信息</div>
    <el-row :gutter="16">
      <el-col :span="8"><el-form-item label="期望薪资"><el-input v-model="f.salary"></el-input></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="最早到岗时间"><el-date-picker v-model="f.onboard" type="date" placeholder="选择日期" value-format="YYYY-MM-DD"></el-date-picker></el-form-item></el-col>
      <el-col :span="8"><el-form-item label="是否接受调剂"><el-switch v-model="f.adjust"></el-switch></el-form-item></el-col>
    </el-row>
    <el-form-item label="自我评价"><el-input v-model="f.intro" type="textarea" :rows="4" maxlength="300" show-word-limit></el-input></el-form-item>
  </el-form>
</div>
<script src="/vendor/vue.js"></script>
<script src="/vendor/element-plus.js"></script>
<script src="/vendor/element-zh.js"></script>
<script>
const app = Vue.createApp({
  data() {
    const prefill = new URLSearchParams(location.search).has("prefill");
    const data = {
      nations: ["汉族", "回族", "满族", "壮族", "维吾尔族", "苗族"],
      regions: [
        { value: "js", label: "江苏省", children: [{ value: "nj", label: "南京市" }, { value: "sz", label: "苏州市" }] },
        { value: "zj", label: "浙江省", children: [{ value: "hz", label: "杭州市" }] },
        { value: "sh", label: "上海市", children: [{ value: "sh", label: "上海市" }] },
      ],
      f: { name: "", phone: "", email: "", gender: "", birth: "", nation: "", politics: "", hometown: [], idno: "",
        edu: [{ school: "", degree: "", major: "", start: "", end: "", gpa: "" }, { school: "", degree: "", major: "", start: "", end: "", gpa: "" }],
        fam: { name: "", rel: "", org: "", phone: "" }, emer: { name: "", phone: "", rel: "" }, salary: "", onboard: "", adjust: false, intro: "" },
    };
    if (prefill) Object.assign(data.f, { nation: "回族", politics: "中共党员", hometown: ["zj", "hz"], gender: "1" }), (data.f.edu[0].school = "南京大学");
    return data;
  },
});
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
window.__vm = app.mount("#app");
</script>
</body>
</html>
