<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>远洋证券 · 网申（保存一段才能加下一段）</title>
<style>body{font:14px sans-serif;max-width:640px;margin:20px auto}.card{border:1px solid #ddd;border-radius:6px;padding:8px 12px;margin:8px 0}.form-item{margin:10px 0;display:flex;gap:8px;align-items:center}.form-item label{width:110px}</style></head>
<body>
<h3>教育经历</h3>
<!-- Saved entries render as read-only cards; only the next one is a form. -->
<div class="card"><strong>复旦大学</strong> · 统计学 · 硕士<br><span>2024.09 - 2026.06</span> <a href="#">编辑</a> <a href="#">删除</a></div>
<div class="edu-form">
  <div class="form-item"><label for="s">学校名称</label><input id="s"></div>
  <div class="form-item"><label for="m">专业</label><input id="m"></div>
  <div class="form-item"><label for="d">学历</label><select id="d"><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></div>
  <div class="form-item"><label for="st">入学时间</label><input id="st" type="month"></div>
  <button type="button">保存</button>
</div>
<h3>实习经历</h3>
<div class="card"><strong>字节跳动</strong> | 数据分析实习生<br>2025.06 - 2025.09</div>
<div class="exp-form">
  <div class="form-item"><label for="c">公司名称</label><input id="c"></div>
  <div class="form-item"><label for="r">职位名称</label><input id="r"></div>
  <button type="button">保存</button>
</div>
<h3>校园经历</h3>
<div class="card"><strong>复旦大学研究生会</strong> | 学术部部长<br>2024.09 - 2025.06 <a href="#">编辑</a></div>
<div class="campus-form">
  <div class="form-item"><label for="k1">组织名称</label><input id="k1"></div>
  <div class="form-item"><label for="k2">担任职务</label><input id="k2"></div>
  <button type="button">保存</button>
</div>
</body></html>
