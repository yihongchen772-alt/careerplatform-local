<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>龙潭集团 · 校招网申（标题和说明、添加在同一行）</title>
<style>body{font:14px sans-serif;max-width:860px;margin:20px auto}.module-head{display:flex;justify-content:space-between}.module-head p{color:#888;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item span{display:block;font-size:12px;color:#666}.item input{width:90%}</style></head>
<body>
<!-- The title shares one header row with a description and an 「添加」 link,
     so the row's whole text is far longer than a heading. -->
<div class="resume-module">
  <div class="module-head">
    <div><div class="module-head__title">奖励荣誉</div><p>奖学金、校内各项比赛、其他荣誉等都可以成为你简历中的亮点</p></div>
    <a href="#">添加</a>
  </div>
  <div class="module-body">
    <div class="grid">
      <div class="item"><span>奖励名称</span><input id="an" placeholder="请填写您在校期间所获的奖励"></div>
      <div class="item"><span>获得时间</span><input id="ad" value="2023-11"></div>
      <div class="item"><span>颁奖机构</span><input id="ai" placeholder="请填写颁奖机构"></div>
    </div>
    <button type="button">保 存</button> <button type="button">取 消</button>
  </div>
</div>
</body></html>
