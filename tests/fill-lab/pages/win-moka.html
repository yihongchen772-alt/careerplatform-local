<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Moka 式：硕士要另填本科一段，项目有职责两个框</title><style>body{font:14px sans-serif;max-width:860px;margin:20px auto}.form-item{margin:8px 0}</style></head><body>
<!-- Fictional, after a Moka form seen in 网申样本: the 本科 of a 硕士 is its own section; a project asks 职责 (short) and 项目中职责 (long). -->
<h3>教育经历</h3>
<div class=form-item><label for=e0-school>学校名称</label><input id=e0-school></div>
<div class=form-item><label for=e0-major>专业名称</label><input id=e0-major></div>
<div class=form-item><label for=e0-deg>学历</label><select id=e0-deg><option value=''>请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></div>
<h3>硕士、博士学历需填写本科教育经历</h3>
<div class=form-item><label for=u-school>学校名称</label><input id=u-school></div>
<div class=form-item><label for=u-major>专业名称</label><input id=u-major></div>
<div class=form-item><label for=u-deg>学历</label><select id=u-deg><option value=''>请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></div>
<h3>项目经验</h3>
<div class=form-item><label for=p-name>项目名称</label><input id=p-name placeholder=项目名称></div>
<div class=form-item><label for=p-role>职责</label><input id=p-role placeholder=职责></div>
<div class=form-item><label for=p-duty>项目中职责</label><textarea id=p-duty placeholder=项目中职责></textarea></div>
<div class=form-item><label for=p-desc>项目描述</label><textarea id=p-desc placeholder=内容></textarea></div>
</body></html>
