<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <text x="256" y="212"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="180" font-weight="700" fill="#ffffff" text-anchor="middle">秋</text>

  <!-- ascending bars = tracking progress, reads as a funnel left-to-right -->
  <g fill="#ffffff" opacity="0.3">
    <rect x="104" y="360" width="52" height="60"  rx="16"/>
    <rect x="180" y="322" width="52" height="98"  rx="16"/>
    <rect x="256" y="284" width="52" height="136" rx="16"/>
    <rect x="332" y="246" width="52" height="174" rx="16"/>
  </g>

  <!-- trend line rising across the bars, with an arrowhead at the top right -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M120 356 L206 316 L282 274 L370 226"/>
    <path d="M312 224 L374 222 L376 284"/>
  </g>
</svg>
