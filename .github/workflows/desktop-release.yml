name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: win32
            architecture: x64
            target: --win --x64
            artifact: windows-x64
            builder_cache: ~/AppData/Local/electron-builder/Cache
            electron_cache: ~/AppData/Local/electron/Cache
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin
            architecture: arm64
            target: --mac --arm64
            artifact: macos-arm64
            builder_cache: ~/Library/Caches/electron-builder
            electron_cache: ~/Library/Caches/electron
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: ${{ matrix.architecture }}
          cache: npm

      - name: Check release inputs without exposing their contents
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { isPrivatePath } = require('./scripts/packaging-prepare.cjs');
          if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) {
            throw new Error('Runner platform/architecture does not match this installer. Native Prisma binaries must be built on the matching host.');
          }
          const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const blocked = tracked.filter(file => file !== '.env.example' && isPrivatePath(file));
          if (blocked.length) {
            // Paths only: do not write key values or database records to CI logs.
            throw new Error('Private files must be removed from Git before building: ' + blocked.join(', '));
          }
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must equal v + package.json version.');
          }
          NODE

      - run: npm ci

      # electron-builder downloads Electron, NSIS and the signing tools from GitHub
      # releases at build time. When that service times out (504) the whole release
      # fails for reasons that have nothing to do with the code, so keep what was
      # downloaded: the next build restores it and only fetches what is missing.
      - name: Read the versions of the tools electron-builder downloads
        id: tools
        run: |
          echo "electron=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "builder=$(node -p "require('electron-builder/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded packaging tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.builder_cache }}
            ${{ matrix.electron_cache }}
          key: packaging-tools-${{ runner.os }}-electron-${{ steps.tools.outputs.electron }}-builder-${{ steps.tools.outputs.builder }}

      - run: npm run test:agent
      - run: npm run test:desktop
      - run: node --test tests/productivity.test.cjs
      - run: node --test tests/packaging.test.cjs
      - run: npm run lint
      - name: Build with an empty database and prepare minimal runtime
        run: |
          node scripts/packaging-build.cjs
          node scripts/packaging-prepare.cjs
      - name: Smoke test the isolated runtime without source dependencies
        run: node scripts/packaging-smoke.cjs
      - name: Build installer locally without publishing
        # Retried: a download that times out succeeds on the next try, and what an
        # earlier try already fetched is kept in the tool cache.
        run: |
          for attempt in 1 2 3; do
            if npx --no-install electron-builder --config electron-builder.cjs ${{ matrix.target }} --publish never; then
              exit 0
            fi
            echo "::warning::electron-builder attempt $attempt of 3 failed"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
      - name: Verify release asset set
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const yaml = require('js-yaml');
          const version = require('./package.json').version;
          const files = fs.readdirSync('dist-electron');
          const installer = process.env.EXPECTED_PLATFORM === 'win32'
            ? `JobCompass-${version}-win-x64.exe`
            : `JobCompass-${version}-mac-arm64.dmg`;
          const required = process.env.EXPECTED_PLATFORM === 'win32'
            ? [installer, `${installer}.blockmap`, 'latest.yml']
            : [installer];
          for (const file of required) {
            if (!files.includes(file) || !fs.statSync(path.join('dist-electron', file)).size) {
              throw new Error('Expected installer/update asset missing or empty: ' + file);
            }
          }
          if (process.env.EXPECTED_PLATFORM === 'win32') {
            const update = yaml.load(fs.readFileSync('dist-electron/latest.yml', 'utf8'));
            const payload = fs.readFileSync(path.join('dist-electron', installer));
            const sha512 = crypto.createHash('sha512').update(payload).digest('base64');
            const entry = update.files?.find(file => file.url === installer);
            if (update.version !== version || update.path !== installer || update.sha512 !== sha512 ||
                update.files?.length !== 1 || !entry || entry.sha512 !== sha512 || entry.size !== payload.length) {
              throw new Error('Windows update metadata does not match the installer version, size and checksum.');
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-electron/JobCompass-*.exe
            dist-electron/JobCompass-*.exe.blockmap
            dist-electron/JobCompass-*.dmg
            dist-electron/latest.yml

  draft-release:
    name: Prepare GitHub release draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create reviewable draft with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ### ✨ v2.2.0 核心更新：👥 原生多求职人档案一键切换（Multi-Profile Switcher）

          支持在同一台电脑上帮对象或家人代投简历，零串号、免重复配置 AI Key：
          - **100% 物理隔离**：每个求职人档案拥有独立的本地数据库（投递看板、候选池、网申填表记忆、收件箱账号）、独立的简历与附件目录，以及**独立的内置网申浏览器 Cookie 分区**（登录字节、腾讯、北森、Moka 等招聘官网手机号绝不串号）。
          - **AI Key 跨档案无感共享**：新建或切换到新求职人档案时，底层自动从主档案解密并重加密同步已配置的 AI 服务密钥与默认模型，开箱即用免重复配置。
          - **丝滑热切换与双入口 UI**：侧边栏顶部新增彩色徽章切换器（代投模式下提供醒目防误投标识），系统顶部菜单栏与托盘菜单同步支持「👥 切换求职人」一键秒切。
          - **100% 向后兼容零丢数据**：原有主档案（`default`）继续使用原用户数据根目录与原浏览器会话分区，升级后历史投递记录、简历与官网登录态完整保留。

          ---

          ### 📦 下载与更新说明
          - **Windows（64位）**：下载 `JobCompass-2.2.0-win-x64.exe`（已安装旧版亦可在软件「设置 → 版本更新」内检查更新）。
          - **macOS（Apple Silicon M 系列芯片）**：下载 `JobCompass-2.2.0-mac-arm64.dmg`，拖入「应用程序」覆盖即可（首次打开如遇系统拦截请右键点击选择「打开」）。
          - 更新过程会自动备份并保留 `careerplatform` 用户数据目录中的全部数据库、附件与密钥。
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            node -e "if (!require('./existing-release.json').isDraft) throw new Error('Refusing to replace a published release. Increment the version instead.');"
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --verify-tag --title "求职罗盘 $RELEASE_TAG" --notes-file release-notes.md
          fi
