name: Daily Postings Feed Mirror

on:
  schedule:
    # Runs daily at 06:00 Beijing Time (22:00 UTC)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postings-feed-mirror
  cancel-in-progress: true

jobs:
  build-and-publish-feed:
    name: Aggregate Official Boards & Update Cloud Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aggregate live official job boards
        run: node scripts/build-postings-feed.cjs

      - name: Publish to postings-feed release tag (prerelease so /releases/latest is untouched)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="postings-feed"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --title "每日名企直招岗位池镜像 (自动更新)" \
              --notes "由 GitHub Actions 每日定时聚合名企官网直招岗位生成的云端分片快照，供求职罗盘客户端按赛道免配置一键拉取（标记为 prerelease，不影响桌面端版本更新检测）。"
          fi
          gh release upload "$TAG" \
            .local-run/postings-feed/*.json.gz \
            .local-run/postings-feed/postings-feed-meta.json \
            --clobber
